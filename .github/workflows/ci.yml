# Every push and pull request: the full check on trijya-7 (secrets, Python, self-tests, shell, site build).
# Nothing is installed here: only a published GitHub Release goes live (release.yml).
# The repo is public and the runner is an office machine: pull requests from forks NEVER run here (the `if` below).
# Their changes are checked after a maintainer pulls them into a branch of this repo.
name: check
on:
  push:
  pull_request:
concurrency: { group: "check-${{ github.ref }}", cancel-in-progress: true }
jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rig-video]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: deploy/check.sh
